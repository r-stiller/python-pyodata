[project]
# Modified in this fork; see NOTICE for additional attribution and disclaimer.
authors = [{name = "Rene Stiller"}]
dependencies = []
name = "python-pyodata"
requires-python = ">= 3.11"
version = "1.12.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]


# =============================================================================
# WORKSPACE
# =============================================================================

[tool.pixi.workspace]
channels 		= ["conda-forge"]
platforms 		= ["win-64"]


# =============================================================================
# ENVIRONMENTS
# =============================================================================

[tool.pixi.environments]
pyodata-prod    = { solve-group = "default" }
pyodata-dev		= { features = ["dev",], solve-group = "default" }


# =============================================================================
# DEPENDENCIES — Core
# =============================================================================

[tool.pixi.dependencies]
lxml 			= ">=4.2.6"

[tool.pixi.pypi-dependencies]
python_pyodata 	= { path = ".", editable = true }


# =============================================================================
# DEPENDENCIES — Feature: dev
# =============================================================================

[tool.pixi.feature.dev.dependencies]
bandit          = "==1.7.5"
pixi-pycharm    = ">=0.0.10"
pytest        	= "*"
pytest-aiohttp	= "*"
pytest-cov      = "*"
requests        = ">=2.28.1"
responses       = "*"
httpx           = ">=0.23.0"
respx           = ">=0.19.2"
ruff            = ">=0.15.0"
ty              = ">=0.0.14"

[tool.ruff.lint]
ignore = ["E501"]
